<!-- Overlay -->
<div id="cartOverlay" class="fixed inset-0 bg-black/40 opacity-0 pointer-events-none
            transition-opacity duration-300 z-40">
</div>


<!-- Sidebar -->
<div id="cartSidebar" class="fixed right-0 top-0 h-full w-full sm:w-96 bg-white shadow-2xl
            translate-x-full transition-transform duration-300
            z-50 flex flex-col">

  <!-- Header -->
  <div class="px-6 py-5 flex items-center justify-between border-b">

    <h2 class="text-lg font-semibold tracking-wide">
      Carrito
    </h2>

    <button onclick="toggleCart()" class="text-gray-500 hover:text-black text-xl">
      ✕
    </button>

  </div>


  <!-- Items -->
  <div id="cartItems" class="flex-1 overflow-y-auto px-6 py-6 space-y-5">

    <p id="cartEmptyMessage" class="text-gray-400 text-sm text-center">
      El carrito está vacío
    </p>

  </div>


  <!-- Footer -->
  <div class="border-t px-6 py-5">

    <button onclick="sendWhatsAppQuote()" class="w-full bg-green-500 text-white py-3 text-sm tracking-wide
         hover:bg-green-600 transition flex items-center justify-center gap-2">

      <!-- icono whatsapp -->
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 32 32" fill="currentColor">
        <path
          d="M16.04 2C8.28 2 2 8.27 2 16c0 2.82.83 5.45 2.26 7.67L2 30l6.52-2.2A13.94 13.94 0 0016.04 30C23.8 30 30 23.73 30 16S23.8 2 16.04 2zm0 25.6c-2.36 0-4.66-.64-6.66-1.86l-.48-.28-3.87 1.3 1.26-3.77-.31-.49A11.57 11.57 0 014.4 16C4.4 9.58 9.63 4.4 16.04 4.4c6.42 0 11.6 5.18 11.6 11.6s-5.18 11.6-11.6 11.6zm6.37-8.7c-.35-.17-2.05-1.01-2.37-1.13-.32-.12-.55-.17-.78.17s-.9 1.13-1.1 1.36c-.2.23-.4.26-.75.09-.35-.17-1.49-.55-2.83-1.76-1.05-.93-1.76-2.07-1.96-2.42-.2-.35-.02-.54.15-.71.15-.15.35-.4.52-.6.17-.2.23-.35.35-.58.12-.23.06-.43-.03-.6-.09-.17-.78-1.88-1.07-2.58-.28-.68-.56-.59-.78-.6h-.67c-.23 0-.6.09-.92.43s-1.2 1.17-1.2 2.85 1.23 3.3 1.4 3.53c.17.23 2.41 3.68 5.83 5.16.81.35 1.44.56 1.93.72.81.26 1.54.22 2.12.13.65-.1 2.05-.84 2.34-1.65.29-.81.29-1.5.2-1.65-.09-.15-.32-.23-.67-.4z" />
      </svg>

      Enviar cotización por WhatsApp

    </button>

  </div>

</div>


<!-- Item template -->
<template id="cartItemTemplate">

  <div class="border rounded-lg p-4 flex flex-col gap-2" data-cart-item>

    <div class="font-medium text-sm" data-cart-product></div>

    <div class="text-xs text-gray-500" data-cart-variant></div>

    <div class="flex items-center justify-between mt-2">

      <!-- qty controls -->
      <div class="flex items-center border rounded">

        <button data-cart-decrease class="px-3 py-1 text-gray-500 hover:bg-gray-100">
          −
        </button>

        <span data-cart-qty class="px-3 text-sm"></span>

        <button data-cart-increase class="px-3 py-1 text-gray-500 hover:bg-gray-100">
          +
        </button>

      </div>

      <button data-cart-remove class="text-xs text-gray-400 hover:text-red-500">

        Eliminar

      </button>

    </div>

  </div>

</template>
